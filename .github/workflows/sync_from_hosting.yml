name: Mirror hosting -> GitHub (mixed paths + auto filename)

on:
  workflow_dispatch:

concurrency:
  group: mirror-hosting
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    concurrency:
      group: mirror-hosting-job
      cancel-in-progress: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main

      - name: Mirror hosting
        shell: bash
        run: |
          set -euo pipefail

          # ===== GLOBAL VERSION & URLS =====
          VERSION="4.7"

          BASE_ROOT="https://nskmedia.net/rizwan"
          BASE_VERSION="${BASE_ROOT}/${VERSION}"
          BASE_BPDLL="${BASE_ROOT}/BpDllUpdates"

          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64)"

          # Versioned folders (e.g. 4.7/GL)
          FOLDERS_VERSION=(GL KR TW VNG)

          # Root folders (e.g. ./BGMI)
          FOLDERS_ROOT=(BGMI GLITCH LDPLAYER LOG TEST1 TEST2 TEST3 TEST4)

          # Known subfolders under BpDllUpdates (from cPanel)
          KNOWN_BPDLL_SUBFOLDERS=(EOMAX Loki MrEslam Shadow SuperRussia)
          BPDLL_SUBFOLDERS=("${KNOWN_BPDLL_SUBFOLDERS[@]}")

          FALLBACK_DEFAULT=("libopenplatform.so")

          # Discover directories inside a given folder URL (e.g. BpDllUpdates/)
          discover_subfolders () {
            local folder_url="$1"
            local html code

            html="$(mktemp)"

            code="$(curl -L -A "$UA" -sS \
              -o "$html" \
              -w "%{http_code}" \
              "${folder_url}/" || true)"

            if [[ "$code" != "200" ]]; then
              rm -f "$html"
              return 1
            fi

            grep -Eo 'href="[^"]+/"' "$html" \
              | sed 's/^href="//; s/"$//' \
              | grep -vE '^\?|^/|^\.\./' \
              | sed 's#/$##' \
              | sort -u || true

            rm -f "$html"
          }

          # Discover files inside a given folder URL
          discover_files () {
            local folder_url="$1"
            local html code

            html="$(mktemp)"

            code="$(curl -L -A "$UA" -sS \
              -o "$html" \
              -w "%{http_code}" \
              "${folder_url}/" || true)"

            if [[ "$code" != "200" ]]; then
              rm -f "$html"
              return 1
            fi

            grep -Eo 'href="[^"]+"' "$html" \
              | sed 's/^href="//; s/"$//' \
              | grep -vE '^\?|^/|^\.\./|/$' \
              | grep -E '\.' \
              | sort -u || true

            rm -f "$html"
          }

          # Fallback file list if directory indexing is 403 or disabled
          fallback_for_folder () {
            local folder="$1"

            # Check if this folder belongs to BpDllUpdates subfolders
            for bsf in "${BPDLL_SUBFOLDERS[@]}"; do
              if [[ "$folder" == "$bsf" ]]; then
                printf "%s\n" \
                  "ChineseEgg.dll" \
                  "SUPERMAN-OFFICIAL.exe" \
                  "libopenplatform.so" \
                  "libCrashSight.so" \
                  "${folder}.dll" \
                  "${folder}.exe" \
                  "bp.dll" \
                  "bypass.dll"
                return 0
              fi
            done

            case "$folder" in
              BGMI)
                printf "%s\n" \
                  "libopenplatform.so" \
                  "libswappy.so"
                ;;

              LOG)
                printf "%s\n" \
                  "adb" \
                  "AdbWinApi" \
                  "libCrashSight.so"
                ;;

              BpDllUpdates)
                printf "%s\n" \
                  "status" \
                  "version"
                ;;

              *)
                printf "%s\n" "${FALLBACK_DEFAULT[@]}"
                ;;
            esac
          }

          sync_file () {
            local url="$1"
            local dest="$2"

            mkdir -p "$(dirname "$dest")"

            local tmp
            tmp="$(mktemp)"

            local code
            code="$(curl -L -A "$UA" -sS \
              -o "$tmp" \
              -w "%{http_code}" \
              "$url" || true)"

            # File removed from hosting
            if [[ "$code" == "404" ]]; then
              rm -f "$tmp"
              if [[ -f "$dest" ]]; then
                echo "Removed: $dest (404 on server)"
                rm -f "$dest"
              fi
              return 0
            fi

            # Ignore other HTTP errors
            if [[ "$code" != "200" ]]; then
              rm -f "$tmp"
              return 0
            fi

            # New file
            if [[ ! -f "$dest" ]]; then
              echo "Added: $dest"
              mv -f "$tmp" "$dest"
              return 0
            fi

            # Compare existing file
            local sha_new sha_old

            sha_new="$(sha256sum "$tmp" | awk '{print $1}')"
            sha_old="$(sha256sum "$dest" | awk '{print $1}')"

            if [[ "$sha_new" == "$sha_old" ]]; then
              rm -f "$tmp"
              return 0
            fi

            # Updated file
            echo "Updated: $dest"
            mv -f "$tmp" "$dest"
          }

          process_folder () {
            local folder="$1"
            local base="$2"
            local dest_prefix="$3"

            local folder_url="${base}/${folder}"

            mapfile -t files < <(
              discover_files "$folder_url" || true
            )

            # Use fallback if directory listing cannot be discovered
            if [[ "${#files[@]}" -eq 0 ]]; then
              mapfile -t files < <(
                fallback_for_folder "$folder"
              )
            fi

            for fname in "${files[@]}"; do
              [[ -z "$fname" ]] && continue
              sync_file \
                "${folder_url}/${fname}" \
                "${dest_prefix}/${folder}/${fname}"
            done
          }

          # ===== 1) VERSIONED FOLDERS =====
          for f in "${FOLDERS_VERSION[@]}"; do
            process_folder \
              "$f" \
              "$BASE_VERSION" \
              "$VERSION"
          done

          # ===== 2) ROOT FOLDERS =====
          for f in "${FOLDERS_ROOT[@]}"; do
            process_folder \
              "$f" \
              "$BASE_ROOT" \
              "."
          done

          # ===== 3) BPDLL UPDATES (SUBFOLDERS & FILES) =====
          # Try dynamic discovery of subfolders inside BpDllUpdates
          mapfile -t detected_bpdll_subfolders < <(
            discover_subfolders "$BASE_BPDLL" || true
          )

          # Merge known subfolders with any newly discovered subfolders
          combined_bpdll_subfolders=()
          for sf in "${KNOWN_BPDLL_SUBFOLDERS[@]}" "${detected_bpdll_subfolders[@]}"; do
            [[ -n "$sf" ]] && combined_bpdll_subfolders+=("$sf")
          done

          mapfile -t BPDLL_SUBFOLDERS < <(
            printf "%s\n" "${combined_bpdll_subfolders[@]}" | sort -u
          )

          # Sync files inside each subfolder (EOMAX, Loki, MrEslam, Shadow, SuperRussia)
          for sub in "${BPDLL_SUBFOLDERS[@]}"; do
            process_folder \
              "$sub" \
              "$BASE_BPDLL" \
              "BpDllUpdates"
          done

          # Sync any files directly placed in BpDllUpdates root
          process_folder \
            "BpDllUpdates" \
            "$BASE_ROOT" \
            "."

          # ===== 4) INDIVIDUAL ROOT & VERSION FILES =====
          sync_file \
            "${BASE_VERSION}/status" \
            "${VERSION}/status"

          sync_file \
            "${BASE_VERSION}/libCrashSight.so" \
            "${VERSION}/libCrashSight.so"

          sync_file \
            "${BASE_ROOT}/libsupermanauth.so" \
            "libsupermanauth.so"

      - name: Commit & push if changed
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Mirror hosting folders"

          for i in 1 2 3; do
            git fetch origin main

            git rebase origin/main || {
              git rebase --abort || true
            }

            if git push origin HEAD:main; then
              exit 0
            fi

            sleep 2
          done

          exit 1
