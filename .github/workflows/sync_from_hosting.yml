name: Mirror hosting -> GitHub (mixed paths + auto filename)

on:
  workflow_dispatch:

concurrency:
  group: mirror-hosting
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to latest main (before download)
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main

      - name: Mirror hosting
        shell: bash
        run: |
          set -euo pipefail

          BASE_ROOT="https://nskmedia.net/rizwan"
          BASE_42="https://nskmedia.net/rizwan/4.2"

          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36"

          FOLDERS_42=(GL KR TW VNG)
          FOLDERS_ROOT=(BGMI GLITCH LDPLAYER LOG TEST1 TEST2 TEST3 TEST4)

          FALLBACK_DEFAULT=("libopenplatform.so")

          fallback_for_folder () {
            local folder="$1"
            case "$folder" in
              BGMI)
                printf "%s\n" "libopenplatform.so" "libswappy.so"
                ;;
              LOG)
                printf "%s\n" "adb" "AdbWinApi"
                ;;
              *)
                printf "%s\n" "${FALLBACK_DEFAULT[@]}"
                ;;
            esac
          }

          discover_files () {
            local folder_url="$1"
            local html code
            html="$(mktemp)"
            code="$(curl -L -A "$UA" -sS -o "$html" -w "%{http_code}" "${folder_url}/" || true)"

            if [[ "$code" != "200" ]]; then
              rm -f "$html"
              return 1
            fi

            grep -Eo 'href="[^"]+"' "$html" \
              | sed 's/^href="//; s/"$//' \
              | grep -vE '^\?|^/|^\.\./|/$' \
              | grep -E '\.' \
              | sort -u

            rm -f "$html"
            return 0
          }

          sync_file () {
            local url="$1"
            local dest="$2"

            mkdir -p "$(dirname "$dest")"
            local tmp
            tmp="$(mktemp)"

            local code
            code="$(curl -L -A "$UA" -sS -o "$tmp" -w "%{http_code}" "$url" || true)"

            if [[ "$code" == "404" ]]; then
              rm -f "$tmp"
              [[ -f "$dest" ]] && rm -f "$dest"
              return 0
            fi

            if [[ "$code" != "200" ]]; then
              rm -f "$tmp"
              return 0
            fi

            if [[ ! -f "$dest" ]]; then
              mv -f "$tmp" "$dest"
              return 0
            fi

            local sha_new sha_old
            sha_new="$(sha256sum "$tmp" | awk '{print $1}')"
            sha_old="$(sha256sum "$dest" | awk '{print $1}')"

            [[ "$sha_new" == "$sha_old" ]] && rm -f "$tmp" && return 0

            mv -f "$tmp" "$dest"
          }

          process_folder () {
            local folder="$1"
            local base="$2"
            local dest_prefix="$3"

            local folder_url="${base}/${folder}"

            mapfile -t files < <(discover_files "$folder_url" || true)

            if [[ "${#files[@]}" -eq 0 ]]; then
              mapfile -t files < <(fallback_for_folder "$folder")
            fi

            for fname in "${files[@]}"; do
              local url="${folder_url}/${fname}"
              local dest="${dest_prefix}/${folder}/${fname}"
              sync_file "$url" "$dest"
            done
          }

          # 4.2 folders
          for f in "${FOLDERS_42[@]}"; do
            process_folder "$f" "$BASE_42" "4.2"
          done

          # root folders
          for f in "${FOLDERS_ROOT[@]}"; do
            process_folder "$f" "$BASE_ROOT" "."
          done

          # ===== 4.2 ROOT SINGLE FILES =====
          sync_file "${BASE_42}/status" "4.2/status"
          sync_file "${BASE_42}/libswappy.so" "4.2/libswappy.so"

      - name: Commit & push if changed
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git config merge.ours.driver true

          if [[ ! -f .gitattributes ]]; then
            cat > .gitattributes <<'EOF'
          *.so merge=ours -text
          *.dll merge=ours -text
          *.exe merge=ours -text
          EOF
            git add .gitattributes
          fi

          git add -A
          git diff --cached --quiet && exit 0

          git commit -m "Mirror hosting folders"

          for i in 1 2 3; do
            git fetch origin main
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main && exit 0
            sleep 2
          done

          exit 1
