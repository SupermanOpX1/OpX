name: Mirror hosting -> GitHub (mixed paths + auto filename)

on:
  workflow_dispatch:

concurrency:
  group: mirror-hosting
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    concurrency:
      group: mirror-hosting-job
      cancel-in-progress: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main

      - name: Mirror hosting
        shell: bash
        run: |
          set -euo pipefail

          # ===== GLOBAL VERSION =====
          VERSION="4.5"

          BASE_ROOT="https://nskmedia.net/rizwan"
          BASE_VERSION="${BASE_ROOT}/${VERSION}"

          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64)"

          FOLDERS_VERSION=(GL KR TW VNG)
          FOLDERS_ROOT=(BGMI GLITCH LDPLAYER LOG TEST1 TEST2 TEST3 TEST4)

          FALLBACK_DEFAULT=("libopenplatform.so")

          fallback_for_folder () {
            local folder="$1"
            case "$folder" in
              BGMI) printf "%s\n" "libopenplatform.so" "libswappy.so" ;;
              LOG) printf "%s\n" "adb" "AdbWinApi" ;;
              *) printf "%s\n" "${FALLBACK_DEFAULT[@]}" ;;
            esac
          }

          discover_files () {
            local folder_url="$1"
            local html code
            html="$(mktemp)"
            code="$(curl -L -A "$UA" -sS -o "$html" -w "%{http_code}" "${folder_url}/" || true)"

            [[ "$code" != "200" ]] && rm -f "$html" && return 1

            grep -Eo 'href="[^"]+"' "$html" \
              | sed 's/^href="//; s/"$//' \
              | grep -vE '^\?|^/|^\.\./|/$' \
              | grep -E '\.' \
              | sort -u

            rm -f "$html"
          }

          sync_file () {
            local url="$1"
            local dest="$2"

            mkdir -p "$(dirname "$dest")"
            local tmp
            tmp="$(mktemp)"

            local code
            code="$(curl -L -A "$UA" -sS -o "$tmp" -w "%{http_code}" "$url" || true)"

            [[ "$code" == "404" ]] && rm -f "$tmp" && rm -f "$dest" && return 0
            [[ "$code" != "200" ]] && rm -f "$tmp" && return 0

            if [[ ! -f "$dest" ]]; then
              mv -f "$tmp" "$dest"
              return 0
            fi

            local sha_new sha_old
            sha_new="$(sha256sum "$tmp" | awk '{print $1}')"
            sha_old="$(sha256sum "$dest" | awk '{print $1}')"

            [[ "$sha_new" == "$sha_old" ]] && rm -f "$tmp" && return 0
            mv -f "$tmp" "$dest"
          }

          process_folder () {
            local folder="$1"
            local base="$2"
            local dest_prefix="$3"

            local folder_url="${base}/${folder}"
            mapfile -t files < <(discover_files "$folder_url" || true)

            [[ "${#files[@]}" -eq 0 ]] && mapfile -t files < <(fallback_for_folder "$folder")

            for fname in "${files[@]}"; do
              sync_file "${folder_url}/${fname}" "${dest_prefix}/${folder}/${fname}"
            done
          }

          # ===== VERSIONED FOLDERS =====
          for f in "${FOLDERS_VERSION[@]}"; do
            process_folder "$f" "$BASE_VERSION" "$VERSION"
          done

          # ===== ROOT FOLDERS =====
          for f in "${FOLDERS_ROOT[@]}"; do
            process_folder "$f" "$BASE_ROOT" "."
          done

          sync_file "${BASE_VERSION}/status" "${VERSION}/status"
          sync_file "${BASE_VERSION}/libCrashSight.so" "${VERSION}/libCrashSight.so"

      - name: Commit & push if changed
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0

          git commit -m "Mirror hosting folders"

          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main || true
            git push origin HEAD:main && exit 0
            sleep 2
          done

          exit 1
